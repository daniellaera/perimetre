# Périmètre production stack, /opt/perimetre on perimetre-prod (see CLAUDE.md,
# "Production"). Synced there by deploy/ship.sh; always run with the env file:
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod <command>
#
# Only Caddy publishes ports. The backend and Postgres are reachable on the
# compose network alone, so X-Forwarded-* can only come from Caddy. Never add
# `ports:` to db or backend: Docker's published ports bypass ufw/iptables
# INPUT rules. There is no Redis in prod.
#
# Memory on the 4 GB VPS (plus 2 GB swap): backend 1.5 GB + db 1.25 GB +
# caddy 256 MB = ~3 GB, leaving ~0.9 GB for the OS and the page cache.
name: perimetre

# Every container's log is capped (Docker's json-file default has no limit).
# 5 x 10 MB per container; `docker logs` reads across the rotated files.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: always
    logging: *default-logging
    depends_on:
      - backend
    ports:
      # TCP only: the Infomaniak firewall allows 80/443 TCP, so no HTTP/3 (see Caddyfile).
      - "80:80"
      - "443:443"
    volumes:
      # Directories, not single files (ship.sh puts deploy/Caddyfile in caddy/):
      # a file bind mount would keep showing the old copy after a sync.
      - ./caddy:/etc/caddy:ro
      - ./site:/srv/site:ro
      # Certificates and ACME account: losing this volume means re-issuing.
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m

  backend:
    # BACKEND_TAG is set by ship.sh for a rollback or a pinned deploy; :latest otherwise.
    image: registry.gitlab.com/daniellaera1/perimetre/backend:${BACKEND_TAG:-latest}
    restart: always
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    # SPRING_PROFILES_ACTIVE, DB_URL, DB_USER, DB_PASSWORD, FIREBASE_CREDENTIALS,
    # ADMIN_TOKEN, and the optional HEALTHCHECK_PING_URL (empty = no pings). application-prod.yml has no defaults, so a missing one fails
    # the startup; AdminSecurityConfig refuses an ADMIN_TOKEN under 32 chars.
    env_file: .env.prod
    environment:
      # Log timestamps in the zone the cron jobs run in. The @Scheduled crons
      # pin zone = "Europe/Zurich" themselves and do not depend on it.
      TZ: Europe/Zurich
      # Heap = 75 % of mem_limit (~1.1 GB); the rest is metaspace, threads and
      # buffers. Exit on OOM so restart: always brings back a clean JVM.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
    volumes:
      # Firebase service account (600, uid 1000 = ubuntu = the image's user).
      - ./secrets:/secrets:ro
    # A full import holds ~21 pages of GeoJSON (~21k features) in memory
    # before writing.
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  db:
    image: imresamu/postgis:17-3.5@sha256:35fe7dceda62bfe7d2965b0ba78d915ff9f901b5e0466d633ecc58421b5b5210
    restart: always
    logging: *default-logging
    # terse: no DETAIL in Postgres's own log, where a constraint violation
    # prints the offending row (push tokens included). log_timezone: the
    # cluster was initialised in UTC and keeps that in postgresql.conf, so TZ
    # alone would not change the log. The session `timezone` stays UTC; the
    # backend's JDBC sessions use the JVM's zone anyway.
    #
    # Memory: shared_buffers 512 MB holds the whole dataset (~21k dossiers,
    # tens of MB with indexes) many times over. work_mem 16 MB: the import's
    # heaviest statement is one `id_dossier = ANY(<21k ids>)` lookup on the
    # primary key plus 500-row upsert batches, none of which sorts or hashes
    # more than a few MB; 16 MB x 5 Hikari connections stays small.
    command:
      - postgres
      - -c
      - log_error_verbosity=terse
      - -c
      - log_timezone=Europe/Zurich
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
    environment:
      TZ: Europe/Zurich
      POSTGRES_DB: perimetre
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Docker's default /dev/shm is 64 MB; parallel queries allocate their
    # dynamic shared memory there.
    shm_size: 256m
    # shared_buffers (512 MB, counted once touched) + backends + maintenance.
    mem_limit: 1280m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db_data:
  caddy_data:
  caddy_config:
