# Périmètre — CI: tests merge requests, builds and pushes the backend image, never deploys.
#
# Deployment stays manual (deploy/ship.sh, or the `ship` skill), like DealJE.
# Merge requests: backend tests (unit + context tests against a PostGIS service),
# `flutter analyze` and a gitleaks scan of the history. On every push to main: the same checks, then
# registry.gitlab.com/daniellaera1/perimetre/backend tagged :<short-sha> and :latest.
# Other branches without an MR run nothing.
#
# Shared (instance) runners: the homelab runner is a DealJE project runner,
# not available here.

stages:
  - test
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

backend-test:
  stage: test
  # Same JDK as the image's build stage (backend/Dockerfile); the Gradle toolchain wants Temurin 21.
  image: eclipse-temurin:21.0.12.1_1-jdk-jammy@sha256:742daacb9316be4b6fc60258f6e4ac2a11882f6c597373c92290a57bfad0d2e0
  services:
    # Same PostGIS as docker-compose.yml and prod; the context tests migrate it with Flyway.
    - name: imresamu/postgis:17-3.5
      alias: postgis
  variables:
    POSTGRES_DB: perimetre
    POSTGRES_USER: perimetre
    POSTGRES_PASSWORD: perimetre
    DB_URL: jdbc:postgresql://postgis:5432/perimetre
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-home
  cache:
    key: gradle-$CI_JOB_NAME
    paths:
      - .gradle-home/caches
      - .gradle-home/wrapper
  script:
    - cd backend
    - ./gradlew --no-daemon test
  artifacts:
    when: always
    reports:
      junit: backend/build/test-results/test/*.xml
  interruptible: true

app-analyze:
  stage: test
  # cirruslabs/flutter has no 3.47 tag yet: its image brings the Linux dependencies, and the SDK is
  # checked out at the version used locally (CLAUDE.md, "App").
  image: ghcr.io/cirruslabs/flutter:stable
  variables:
    FLUTTER_VERSION: "3.47.7"
    FLUTTER_SDK: $CI_PROJECT_DIR/.flutter-sdk
  cache:
    key: flutter-$FLUTTER_VERSION
    paths:
      - .flutter-sdk
  script:
    - '[ -x "$FLUTTER_SDK/bin/flutter" ] || git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$FLUTTER_SDK"'
    - export PATH="$FLUTTER_SDK/bin:$PATH"
    - flutter --version
    - cd app
    # The Firebase client config is not in git: build against the committed placeholders (push disabled).
    - '[ -f lib/firebase_options.dart ] || cp lib/firebase_options.dart.example lib/firebase_options.dart'
    - flutter pub get
    - flutter analyze
    - '[ ! -d test ] || flutter test'
  interruptible: true

secrets-scan:
  stage: test
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  # Whole history of the branch; reviewed false positives are listed in .gitleaksignore.
  script:
    - gitleaks git --redact --verbose .
  interruptible: true

backend-image:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE: $CI_REGISTRY_IMAGE/backend
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # The previous :latest seeds the layer cache (Gradle dependencies), when there is one.
    - docker pull "$IMAGE:latest" || true
    - >
      docker build
      --cache-from "$IMAGE:latest"
      --build-arg BUILDKIT_INLINE_CACHE=1
      --label org.opencontainers.image.revision="$CI_COMMIT_SHA"
      --label org.opencontainers.image.source="$CI_PROJECT_URL"
      -t "$IMAGE:$CI_COMMIT_SHORT_SHA"
      -t "$IMAGE:latest"
      backend
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:latest"
  interruptible: true
