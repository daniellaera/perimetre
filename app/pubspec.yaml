name: perimetre
description: "Périmètre: notifications of building-permit dossiers around your addresses in Geneva."
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.13.5

dependencies:
  dio: ^5.11.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  latlong2: ^0.10.1
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    # The Mapbox logo, required on Mapbox maps (lib/map/map_tiles.dart); resolution variants in 2.0x/ and 3.0x/.
    - assets/mapbox-logo.png
