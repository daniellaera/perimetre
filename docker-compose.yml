services:
  db:
    image: imresamu/postgis:17-3.5
    container_name: perimetre-db
    environment:
      POSTGRES_DB: perimetre
      POSTGRES_USER: perimetre
      POSTGRES_PASSWORD: perimetre
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perimetre -d perimetre"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: perimetre-redis
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data: