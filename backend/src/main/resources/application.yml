server:
  port: 8090

spring:
  application:
    name: backend
  datasource:
    # Local defaults (docker-compose.yml); prod sets them from the environment (application-prod.yml).
    url: ${DB_URL:jdbc:postgresql://localhost:5433/perimetre}
    username: ${DB_USER:perimetre}
    password: ${DB_PASSWORD:perimetre}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

perimetre:
  import:
    # Europe/Zurich (the zone is fixed in ImportJob). SITG publishes each day's batch the next morning
    # before 09:16; a late batch is still fetched by the 3-day window (LatePublicationTest). Keep the
    # healthchecks.io check's schedule in line with this one.
    incremental-cron: ${IMPORT_INCREMENTAL_CRON:0 15 10 * * *}
    # The weekly full refresh, after the incremental of the same morning.
    full-cron: ${IMPORT_FULL_CRON:0 45 10 * * SUN}
  parcelle:
    # Cadastral parcels (SITG CAD_PARCELLE_MENSU), after the dossier imports of the same morning. The daily
    # incremental reads parcels mutated since the last run (- 3 days); the weekly full also deletes vanished
    # parcels and recomputes every dossier link. Optional own dead-man's switch: PARCELLE_HEALTHCHECK_PING_URL.
    incremental-cron: ${PARCELLE_INCREMENTAL_CRON:0 30 10 * * *}
    full-cron: ${PARCELLE_FULL_CRON:0 15 11 * * SUN}
  subscriptions:
    # Technical safety cap per device (app installation); POST /devices/{id}/subscriptions answers 409 above it.
    max-per-device: ${SUBSCRIPTIONS_MAX_PER_DEVICE:25}
